[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebbmem-langgraph"
version = "0.1.0"
description = "LangGraph BaseStore, LangChain AgentMiddleware, and LangMem-compatible memory tools for EbbMem (IC-1)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "ebbmem-integration-core>=0.1.0",
  "langgraph>=0.3.0",
]

[project.optional-dependencies]
langchain = [
  "langchain>=1.0.0",
  "langchain-core>=1.0.0",
]
langmem = [
  "langmem>=0.0.30",
]
sdk = [
  "ebbmem-client>=0.2.0",
]
dev = [
  "ebbmem-client>=0.2.0",
  "langchain>=1.0.0",
  "langchain-core>=1.0.0",
  "langmem>=0.0.30",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ebbmem_langgraph = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
