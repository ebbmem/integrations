id: ic1.mcp.golden_schemas
title: MCP v2 2026-07-28 stateless & legacy negotiation, Origin validation, annotations, and outputSchema conformance
ic1_section: "9.1"
modes:
  - mock
  - live
setup:
  exposure_logging:
    - "acme:default"
steps:
  - action: mcp
    path: /mcp/core
    auth: ebb_test_alice_key
    headers:
      Origin: "https://untrusted.example"
    body:
      jsonrpc: "2.0"
      id: 1
      method: ping
    expect_status: 403
  - action: mcp
    path: /mcp/admin
    auth: ebb_test_admin_key
    headers:
      MCP-Protocol-Version: "2026-07-28"
    body:
      jsonrpc: "2.0"
      id: 2
      method: server/discover
      params:
        _meta:
          "io.modelcontextprotocol/protocolVersion": "2026-07-28"
    expect_status: 200
    expect_json:
      result:
        protocolVersion: "2026-07-28"
        cacheScope: "private"
        ttlMs: 60000
  - action: mcp
    path: /mcp/admin
    auth: ebb_test_admin_key
    headers:
      MCP-Protocol-Version: "2026-07-28"
    body:
      jsonrpc: "2.0"
      id: 3
      method: tools/list
    expect_status: 200
    expect_json:
      result:
        cacheScope: "private"
    validate_golden_surface: true
  - action: mcp
    path: /mcp/core
    auth: ebb_test_admin_key
    headers:
      MCP-Protocol-Version: "2026-07-28"
      Mcp-Method: "tools/call"
      Mcp-Name: "memory_remember"
    body:
      jsonrpc: "2.0"
      id: 4
      method: tools/call
      params:
        name: memory_remember
        arguments:
          content: "Golden schema validation memory"
          tier: semantic
    expect_status: 200
    expect_json:
      result:
        resultType: "complete"
    validate_output_schema_for: memory_remember
    save_as: mcp_mem
  - action: mcp
    path: /mcp/core
    auth: ebb_test_admin_key
    headers:
      MCP-Protocol-Version: "2026-07-28"
    body:
      jsonrpc: "2.0"
      id: 5
      method: tools/call
      params:
        name: memory_recall
        arguments:
          query: "Golden schema"
    expect_status: 200
    expect_json:
      result:
        resultType: "complete"
    validate_output_schema_for: memory_recall
  - action: mcp
    path: /mcp/core
    auth: ebb_test_admin_key
    headers:
      MCP-Protocol-Version: "2026-07-28"
    body:
      jsonrpc: "2.0"
      id: 6
      method: tools/call
      params:
        name: memory_reinforce
        arguments:
          memory_id: "${mcp_mem.result.structuredContent.id}"
          delta: 0.2
    expect_status: 200
    validate_output_schema_for: memory_reinforce
  - action: mcp
    path: /mcp/core
    auth: ebb_test_admin_key
    headers:
      MCP-Protocol-Version: "2026-07-28"
    body:
      - jsonrpc: "2.0"
        id: 7
        method: ping
    expect_status: 400
    expect_jsonrpc_error: -32600
  - action: mcp
    path: /mcp/core
    auth: ebb_test_admin_key
    headers:
      MCP-Protocol-Version: "2026-07-28"
    body:
      jsonrpc: "2.0"
      id: 8
      method: unknown/method
    expect_status: 404
    expect_jsonrpc_error: -32601
  - action: mcp
    path: /mcp/core
    auth: ebb_test_admin_key
    headers:
      MCP-Protocol-Version: "2026-07-28"
    body:
      jsonrpc: "2.0"
      id: 9
      method: ping
      params:
        _meta:
          "io.modelcontextprotocol/protocolVersion": "2025-11-25"
    expect_status: 400
    expect_jsonrpc_error: -32020
  - action: mcp
    path: /mcp/core
    auth: ebb_test_admin_key
    headers:
      MCP-Protocol-Version: "1999-01-01"
    body:
      jsonrpc: "2.0"
      id: 10
      method: ping
    expect_status: 400
    expect_jsonrpc_error: -32022
  - action: mcp
    path: /mcp/core
    auth: ebb_test_admin_key
    headers:
      MCP-Protocol-Version: "2025-11-25"
    body:
      jsonrpc: "2.0"
      id: 11
      method: initialize
      params:
        protocolVersion: "2025-11-25"
    expect_status: 200
    expect_json:
      result:
        protocolVersion: "2025-11-25"
