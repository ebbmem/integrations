id: ic1.roundtrip.remember_recall
title: Remember persists memory and recall returns matching result with breakdown
ic1_section: "3.1"
modes:
  - mock
  - live
steps:
  - action: rest
    method: GET
    path: /healthz
    expect_status: 200
    expect_json:
      status: "ok"
  - action: rest
    method: POST
    path: /api/v1/memory/remember
    auth: ebb_test_alice_key
    json:
      content: "User prefers concise TypeScript examples with strict types"
      tier: semantic
      tags: ["typescript", "preferences"]
      importance: 0.8
    expect_status: 201
    expect_json:
      namespace: "acme:u:alice"
      tier: "semantic"
      storage_strength: 1.0
    save_as: created
  - action: rest
    method: POST
    path: /api/v1/memory/recall
    auth: ebb_test_alice_key
    json:
      query: "TypeScript preferences"
      limit: 5
    expect_status: 200
    expect_json:
      count: 1
      results:
        - id: "${created.id}"
          memory_id: "${created.memory_id}"
          tier: "semantic"
          content: "User prefers concise TypeScript examples with strict types"
  - action: rest
    method: GET
    path: /api/v1/memory/recall
    auth: ebb_test_alice_key
    query:
      query: "TypeScript"
      limit: "5"
    expect_status: 200
    expect_json:
      count: 1
      results:
        - id: "${created.id}"
