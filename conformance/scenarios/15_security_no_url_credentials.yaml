id: ic1.security.no_url_or_log_credentials
title: Server rejects URL query and dual credentials and never logs secrets; client rejects URL credentials
ic1_section: "7.1"
modes:
  - mock
  - live
steps:
  - action: client_check
    operation: url_credential_rejection
  - action: rest
    raw_http: true
    method: GET
    path: /api/v1/memory/status
    query:
      api_key: "ebb_test_alice_key"
    expect_status: 400
    expect_json:
      detail: "credentials_in_url"
  - action: rest
    raw_http: true
    method: GET
    path: /api/v1/memory/status
    query:
      token: "ebb_test_alice_key"
    expect_status: 400
    expect_json:
      detail: "credentials_in_url"
  - action: rest
    method: GET
    path: /api/v1/memory/status
    bearer_override: "ebb_test_alice_key"
    api_key_override: "ebb_test_alice_key"
    expect_status: 400
    expect_json:
      detail: "credentials_conflict"
  - action: rest
    method: GET
    path: /api/v1/memory/status
    auth: ebb_test_alice_key
    expect_status: 200
  - action: assert_no_logged_credentials
    forbidden_substrings:
      - "ebb_test_alice_key"
      - "ebb_test_admin_key"
      - "ebb_test_bob_key"
