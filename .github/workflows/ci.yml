name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conformance kit
        run: python -m pip install --upgrade pip && pip install -e "./conformance[dev]"

      - name: Lint with ruff
        run: ruff check conformance

      - name: Check formatting with ruff
        run: ruff format --check conformance

      - name: Run pytest suite
        run: pytest -v conformance/tests

      - name: Run mock conformance CLI
        run: ebbmem-conformance --mode mock
